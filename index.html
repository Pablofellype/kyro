<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kyro</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body, html {
        width: 100%;
        height: 100%;
        background: #ededeb;
        overflow: hidden;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #20201e;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      .carregando-kyro {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(520px 420px at 50% 45%, rgba(255, 59, 71, 0.06), transparent 72%), #ededeb;
        z-index: 99999;
      }

      .kyro-cartao-carregando {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 0;
        animation: kyro-surgir 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .kyro-logo-icone {
        width: 58px;
        height: 58px;
        object-fit: contain;
        border-radius: 13px;
        filter: drop-shadow(0 7px 12px rgba(255, 59, 71, 0.2));
      }

      .kyro-info {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .kyro-nome {
        font-size: 24px;
        font-weight: 600;
        color: #20201e;
        letter-spacing: -0.055em;
      }

      .kyro-sub {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #62625f;
        font-weight: 400;
      }

      .kyro-spinner {
        width: 12px;
        height: 12px;
        border: 1.5px solid #c9cac5;
        border-top-color: #ff3b47;
        border-radius: 50%;
        animation: kyro-rodar 0.8s linear infinite;
      }

      @keyframes kyro-rodar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes kyro-surgir {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }

      html.janela-sobreposta .carregando-kyro { display: none; }
    </style>
  </head>
  <body>
    <div id="raiz">
      <div class="carregando-kyro" aria-busy="true">
        <div class="kyro-cartao-carregando">
          <img class="kyro-logo-icone" src="/apple-touch-icon.png" alt="Kyro" />
          <div class="kyro-info">
            <h1 class="kyro-nome">Kyro</h1>
            <div class="kyro-sub">
              <span class="kyro-spinner"></span>
              <span>Iniciando...</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
