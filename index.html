<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kyro</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/componentes/login/carregamento.css" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body, html {
        width: 100%;
        height: 100%;
        background: #111113;
        overflow: hidden;
        font-family: "Geist", system-ui, "Segoe UI", sans-serif;
        color: #f2efe9;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

    </style>
  </head>
  <body>
    <div id="raiz">
      <div class="kyro-boot" aria-busy="true" aria-label="Carregando Kyro">
        <header class="kyro-boot-topo">
          <div class="kyro-boot-marca"><img src="/apple-touch-icon.png" alt="" width="36" height="36" /><span>kyro<b>.</b></span></div>
          <span class="kyro-boot-assinatura">Seu mundo, bem organizado.</span>
        </header>
        <div class="kyro-boot-centro">
          <div class="kyro-boot-cena" aria-hidden="true">
            <div class="kyro-boot-placa kyro-boot-placa-atras"></div>
            <div class="kyro-boot-placa kyro-boot-placa-frente">
              <div class="kyro-boot-placa-barra"><i></i><i></i><i></i><span></span></div>
              <div class="kyro-boot-miniapp"><img src="/apple-touch-icon.png" alt="" width="26" height="26" /><span></span><span></span></div>
            </div>
            <div class="kyro-boot-ilha"><b>k.</b><i></i><i></i><i></i></div>
          </div>
          <span class="kyro-boot-kicker">PESSOAL. EMPRESA. CONECTADOS.</span>
          <h1 class="kyro-boot-titulo">Seu espaço está chegando<span>.</span></h1>
          <p class="kyro-boot-descricao">Tudo o que move o seu dia, no mesmo lugar.</p>
          <div class="kyro-boot-progresso" role="progressbar" aria-label="Preparando seu espaço"><span></span></div>
          <div class="kyro-boot-status" role="status"><i aria-hidden="true"></i><span>Preparando seu espaço</span></div>
        </div>
        <footer class="kyro-boot-rodape"><span>Mais espaço para o que importa.</span><span>KYRO / BR</span></footer>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
