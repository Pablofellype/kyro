<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kyro</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body, html { width: 100%; height: 100%; background: #000000; overflow: hidden; }

      .carregando-kyro {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        user-select: none;
        z-index: 99999;
      }

      .carregando-kyro img {
        width: 84px;
        height: 84px;
        object-fit: contain;
        animation: apple-respirar 2.4s ease-in-out infinite;
      }

      @keyframes apple-respirar {
        0%, 100% {
          opacity: 0.82;
          transform: scale(0.98);
        }
        50% {
          opacity: 1;
          transform: scale(1.02);
        }
      }

      html.janela-sobreposta .carregando-kyro { display: none; }
    </style>
  </head>
  <body>
    <div id="raiz">
      <div class="carregando-kyro" aria-busy="true">
        <img src="/apple-touch-icon.png" alt="Kyro" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
