<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kyro</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body, html {
        width: 100%;
        height: 100%;
        background: #0e0e10;
        overflow: hidden;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f2f2f2;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      .carregando-kyro {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e0e10;
        z-index: 99999;
      }

      .kyro-cartao-carregando {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 28px 36px;
        background: #161618;
        border: 1px solid #2a2a2e;
        border-radius: 20px;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.2);
        animation: kyro-surgir 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .kyro-logo-icone {
        width: 60px;
        height: 60px;
        object-fit: contain;
        border-radius: 14px;
      }

      .kyro-info {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .kyro-nome {
        font-size: 16px;
        font-weight: 600;
        color: #f2f2f2;
        letter-spacing: -0.01em;
      }

      .kyro-sub {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #9a9aa0;
        font-weight: 400;
      }

      .kyro-spinner {
        width: 13px;
        height: 13px;
        border: 2px solid #2a2a2e;
        border-top-color: #f2f2f2;
        border-radius: 50%;
        animation: kyro-rodar 0.8s linear infinite;
      }

      @keyframes kyro-rodar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes kyro-surgir {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }

      html.janela-sobreposta .carregando-kyro { display: none; }
    </style>
  </head>
  <body>
    <div id="raiz">
      <div class="carregando-kyro" aria-busy="true">
        <div class="kyro-cartao-carregando">
          <img class="kyro-logo-icone" src="/apple-touch-icon.png" alt="Kyro" />
          <div class="kyro-info">
            <h1 class="kyro-nome">Kyro</h1>
            <div class="kyro-sub">
              <span class="kyro-spinner"></span>
              <span>Iniciando...</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
