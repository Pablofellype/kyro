name: Pacotes Windows

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pacotes-windows:
    name: Setup .exe e MSI do Kyro
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Gerar pacotes Windows do Kyro (NSIS e MSI)
        run: pnpm tauri build -b nsis,msi --no-sign

      - uses: actions/upload-artifact@v4
        with:
          name: kyro-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Criar ou Atualizar Release Oficial no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v0.2.7"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG ja existe, atualizando arquivos..."
            gh release upload "$TAG" --repo "${{ github.repository }}" --clobber src-tauri/target/release/bundle/nsis/*.exe || true
            gh release upload "$TAG" --repo "${{ github.repository }}" --clobber src-tauri/target/release/bundle/msi/*.msi || true
          else
            echo "Criando release $TAG com os instaladores do Kyro..."
            gh release create "$TAG" src-tauri/target/release/bundle/nsis/*.exe \
              --repo "${{ github.repository }}" \
              --title "Kyro 0.2.7" \
              --notes "Versão oficial de instalação do Kyro Desktop (v0.2.7) para Windows." \
              --latest
            gh release upload "$TAG" --repo "${{ github.repository }}" --clobber src-tauri/target/release/bundle/msi/*.msi || true
          fi
