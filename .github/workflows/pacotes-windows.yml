name: Pacotes Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pacotes-windows:
    name: Setup .exe e MSI do Kyro
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Conferir versao do projeto
        shell: pwsh
        run: |
          $versao = node -p "require('./package.json').version"
          "KYRO_VERSION=$versao" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          pnpm run lancar:verificar

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Gerar pacotes Windows assinados e manifesto do atualizador
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Configure o segredo TAURI_SIGNING_PRIVATE_KEY no repositorio."
          }
          pnpm lancar $env:KYRO_VERSION --recompilar "Kyro $env:KYRO_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: kyro-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
          if-no-files-found: error

      - name: Publicar instaladores e manifesto na Release Oficial
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "v$env:KYRO_VERSION"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --title "Kyro $env:KYRO_VERSION" --notes "Versao oficial do Kyro Desktop ($tag)." --latest
          }
          $arquivos = @(
            "src-tauri/target/release/bundle/nsis/Kyro_$($env:KYRO_VERSION)_x64-setup.exe",
            "src-tauri/target/release/bundle/nsis/Kyro_$($env:KYRO_VERSION)_x64-setup.exe.sig",
            "src-tauri/target/release/bundle/nsis/latest.json",
            "src-tauri/target/release/bundle/msi/Kyro_$($env:KYRO_VERSION)_x64_pt-BR.msi",
            "src-tauri/target/release/bundle/msi/Kyro_$($env:KYRO_VERSION)_x64_pt-BR.msi.sig"
          )
          gh release upload $tag @arquivos --repo "${{ github.repository }}" --clobber
